<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>symplane-lab — mirror-symmetry certificate</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 2; background: rgba(13,17,23,.86); border: 1px solid #30363d; border-radius: 8px; padding: 12px 14px; width: 340px; }
  #hud h1 { font-size: 14px; margin: 0 0 6px; color: #58a6ff; }
  #hud p { margin: 4px 0; color: #8b949e; }
  .row { display: grid; grid-template-columns: 92px 1fr; gap: 6px; align-items: center; margin: 5px 0; }
  input[type=range] { width: 100%; }
  .num { color: #e6edf3; }
  .ok { color: #3fb950; } .bad { color: #f85149; }
  button { margin-top: 8px; background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  #err { color: #f85149; white-space: pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">
  <h1>symplane-lab</h1>
  <p id="intro">loading scene + baked node reference…</p>
  <div class="row"><span>tilt u</span><input id="a" type="range" min="-0.30" max="0.30" step="0.005" value="0"></div>
  <div class="row"><span>tilt w</span><input id="b" type="range" min="-0.30" max="0.30" step="0.005" value="0"></div>
  <div class="row"><span>offset</span><input id="c" type="range" min="-0.15" max="0.15" step="0.002" value="0"></div>
  <p>live max deviation: <span id="live" class="num">–</span> of diag</p>
  <p>node baked, same samples: <span id="baked" class="num">–</span></p>
  <p>certificate @0.5%: <span id="gate">–</span> <span id="match"></span></p>
  <p id="err"></p>
  <button id="reset">snap to node-detected plane</button>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
